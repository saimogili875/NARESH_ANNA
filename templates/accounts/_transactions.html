<table class="table table-hover align-middle mb-0">
  <thead>
    <tr><th>Receipt</th><th>Student</th><th>Amount</th><th>Mode</th></tr>
  </thead>
  <tbody>
    {% for p in selected_day_payments %}
    <tr>
      <td class="small text-muted font-monospace">#{{ p.receipt_number }}</td>
      <td class="small fw-medium">{{ p.student_fee.student.name }}</td>
      <td class="fw-semibold text-success">₹{{ p.amount|floatformat:0 }}</td>
      <td><span class="badge bg-secondary-subtle text-body border fw-normal">{{ p.get_payment_mode_display }}</span></td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-center text-muted py-4">No transactions on {{ selected_txn_date|date:"d M Y" }}</td></tr>
    {% endfor %}
  </tbody>
</table>
