<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Srinri College</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  .logo { font-size: 2.5rem; color: #1a56db; }
  .college-name { font-size: 1.4rem; font-weight: 700; color: #0f172a; }
  .college-sub { font-size: .8rem; color: #64748b; }
  .form-control { border-radius: 8px; padding: .65rem 1rem; }
  .form-control:focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,.15); }
  .btn-login {
    background: #1a56db; color: #fff;
    border: none; border-radius: 8px;
    padding: .75rem; font-weight: 600;
    width: 100%; font-size: .95rem;
    transition: background .2s;
  }
  .btn-login:hover { background: #1240a5; color: #fff; }
  .role-badge {
    display: inline-block;
    background: #f1f5f9; color: #475569;
    padding: 3px 10px; border-radius: 20px;
    font-size: .7rem; margin: 2px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo"><i class="bi bi-mortarboard-fill"></i></div>
    <div class="college-name">Srinri College</div>
    <div class="college-sub">Management Portal</div>
  </div>

  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-danger py-2 small">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label small fw-500">Role</label>
      <select name="role" class="form-select" required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="faculty">Faculty</option>
        <option value="accounts">Accounts</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-500">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-500">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
    </button>
  </form>

  <div class="text-center mt-4">
    <div class="text-muted small mb-2">Login available for</div>
    <span class="role-badge"><i class="bi bi-shield-fill"></i> Admin</span>
    <span class="role-badge"><i class="bi bi-person-badge"></i> Faculty</span>
    <span class="role-badge"><i class="bi bi-cash"></i> Accounts</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
