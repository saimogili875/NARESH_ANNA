{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h6 class="mb-3">Reset password for <strong>{{ obj.username }}</strong></h6>
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label small">New Password</label>
<input type="password" name="password" class="form-control" required minlength="6"></div>
<div class="d-flex gap-2">
<button type="submit" class="btn btn-primary">Reset</button>
<a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Cancel</a>
</div></form></div></div></div></div>
{% endblock %}
