{% extends 'base.html' %}
{% block title %}Faculty — Sri NRI Junior College{% endblock %}
{% block page_title %}Faculty{% endblock %}
{% block content %}
<div class="d-flex justify-content-end mb-3 gap-2">
  <a href="{% url 'faculty_attendance' %}" class="btn btn-outline-primary btn-sm"><i class="bi bi-calendar-check"></i> Faculty Attendance</a>
  <a href="{% url 'faculty_add' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus"></i> Add Faculty</a>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive" id="faculty-table-container">
      {% include 'faculty/_list_table.html' %}
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function loadFacultyTable() {
    const container = document.getElementById('faculty-table-container');
    if (!container) return;
    const url = window.location.pathname + window.location.search;
    fetch(url, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(res => res.text())
      .then(html => {
        container.innerHTML = html;
      })
      .catch(() => {});
  }
  loadFacultyTable();
});
</script>
{% endblock %}
