<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Attendance Login - Sri NRI Junior College</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            padding: 15px;
        }
        .login-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background: #1a56db;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        .login-header h4 {
            font-weight: 700;
            margin: 0;
            font-size: 1.25rem;
        }
        .login-header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .login-body {
            padding: 24px 20px;
        }
        .window-badge {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.825rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .window-badge.open {
            background: #dcfce7;
            border-color: #86efac;
            color: #166534;
        }
        .window-badge.closed {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .btn-quick {
            background: #1a56db;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-quick:hover {
            background: #1240a5;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-clock-history fs-1 mb-1 d-block"></i>
            <h4>Sri NRI Junior College</h4>
            <p>Tap Attendance Login</p>
        </div>

        <div class="login-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>{{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="window-badge {% if is_open %}open{% else %}closed{% endif %}">
                <div>
                    <i class="bi {% if is_open %}bi-check-circle-fill{% else %}bi-clock-fill{% endif %} me-1"></i>
                    <strong>Window Status:</strong> {% if is_open %}Open{% else %}Closed{% endif %}
                </div>
                <small class="fw-semibold">{{ start_time }} - {{ end_time }}</small>
            </div>

            <form method="POST" action="{% url 'attendance_quick_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label font-weight-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-lg fs-6" id="username" name="username" placeholder="Faculty or Admin ID" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-quick border-0 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In & Open Attendance
                </button>
            </form>
            <div class="text-center mt-3 fs-7 text-muted">
                Server Time: {{ server_time|date:"H:i:s A" }}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
